<!DOCTYPE html>
<html lang="en">

    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      body {
        font-family: var(--font-display);
        background: var(--color-bg);
        color: var(--color-ink);
        margin: 0;
        padding: 10px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
      }

      button { font-family: var(--font-display); }

      .header {
        text-align: center;
        color: var(--color-ink);
        margin-bottom: 10px;
        z-index: 10;
      }

      .header h1 {
        font-size: clamp(1.5em, 5vw, 2em);
        font-weight: 700;
        margin: 0;
      }

      .stats {
        display: flex;
        gap: 20px;
        margin-bottom: 10px;
        color: var(--color-amber);
        font-size: clamp(1em, 3vw, 1.2em);
        font-weight: bold;
        z-index: 10;
      }

      .stats > div {
        background: var(--color-amber-tint);
        padding: 6px 14px;
        border-radius: var(--radius-pill);
      }

      .mode-selector {
        margin-bottom: 10px;
        z-index: 10;
      }

      .mode-btn {
        background: var(--color-amber-tint);
        color: var(--color-amber);
        border: none;
        padding: 8px 16px;
        border-radius: var(--radius-pill);
        font-size: clamp(0.85em, 2.5vw, 1em);
        font-weight: bold;
        cursor: pointer;
        margin: 3px;
        min-height: 44px;
        box-shadow: 0 3px 0 0 #fde68a;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      .mode-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 0 0 #fde68a;
      }

      .mode-btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 0 #fde68a;
      }

      .mode-btn.active {
        background: var(--color-amber);
        color: #ffffff;
        box-shadow: 0 3px 0 0 #7c3a06;
      }

      .mode-btn.active:hover { box-shadow: 0 5px 0 0 #7c3a06; }

      .mode-btn.active:active { box-shadow: 0 1px 0 0 #7c3a06; }

      .target-display {
        background: var(--color-amber-tint);
        padding: 10px 25px;
        border-radius: var(--radius-pill);
        margin-bottom: 10px;
        font-size: clamp(1.2em, 4vw, 1.5em);
        font-weight: bold;
        color: var(--color-amber);
        z-index: 10;
      }

      .game-area {
        position: relative;
        width: 100%;
        max-width: 500px;
        height: 450px;
        background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 100%);
        border-radius: 15px;
        overflow: hidden;
        border: 4px solid #333;
      }

      /* the game area keeps the same column layout the body used to give
         its children directly — the main landmark is semantics, not a new look */
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      /* announced by screen readers, invisible on screen */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      .balloon {
        position: absolute;
        width: 60px;
        height: 75px;
        cursor: pointer;
        transition: transform 0.1s;
        animation: float 3s ease-in-out infinite;
        /* a real <button> so balloons can be popped from the keyboard —
           the UA chrome is reset so it looks exactly as the <div> did */
        padding: 0;
        border: none;
        background: transparent;
        font: inherit;
        color: inherit;
        -webkit-appearance: none;
        appearance: none;
      }

      .balloon:hover {
        transform: scale(1.1);
      }

      .balloon-body {
        width: 60px;
        height: 70px;
        border-radius: 50% 50% 50% 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5em;
        font-weight: bold;
        color: white;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        position: relative;
        box-shadow: inset -5px -5px 15px rgba(0, 0, 0, 0.2), 
                    inset 5px 5px 15px rgba(255, 255, 255, 0.3);
      }

      .balloon-body::after {
        content: '';
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        /* `solid inherit` is invalid in a shorthand, so the whole declaration
           was dropped and the knot never drew — the balloon's colour comes
           through a custom property instead */
        border-top: 12px solid var(--balloon-color, #ff6b6b);
      }

      .balloon-string {
        position: absolute;
        bottom: -20px;
        left: 50%;
        width: 2px;
        height: 20px;
        background: #666;
        transform: translateX(-50%);
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }

      .pop-effect {
        position: absolute;
        font-size: 40px;
        animation: pop 0.4s ease-out forwards;
        pointer-events: none;
        z-index: 100;
      }

      @keyframes pop {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(2); opacity: 0; }
      }

      .score-popup {
        position: absolute;
        font-size: 20px;
        font-weight: bold;
        color: #4ecdc4;
        animation: scoreUp 0.8s ease-out forwards;
        pointer-events: none;
        z-index: 100;
      }

      @keyframes scoreUp {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-40px); opacity: 0; }
      }

      .controls {
        display: flex;
        gap: 10px;
        margin-top: 15px;
        z-index: 10;
      }

      .btn {
        background: var(--color-amber);
        color: #ffffff;
        border: none;
        padding: 12px 24px;
        border-radius: var(--radius-pill);
        font-size: clamp(1em, 3vw, 1.1em);
        font-weight: bold;
        cursor: pointer;
        min-height: 44px;
        box-shadow: 0 4px 0 0 #7c3a06;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 0 #7c3a06; }

      .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 0 #7c3a06; }

      .back-link {
        position: absolute;
        top: 15px;
        left: 15px;
        color: var(--color-amber);
        text-decoration: none;
        font-weight: 600;
        font-size: clamp(0.9em, 3vw, 1em);
        background: var(--color-amber-tint);
        padding: 8px 12px;
        border-radius: var(--radius-pill);
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        box-shadow: 0 3px 0 0 #fde68a;
        transition: transform 120ms ease, box-shadow 120ms ease;
        z-index: 100;
      }

      .back-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 0 0 #fde68a;
      }

      .back-link:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 0 #fde68a;
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .modal-overlay.show { display: flex; }

      .modal {
        background: var(--color-deep);
        border-radius: var(--radius-lg);
        padding: 30px;
        text-align: center;
        max-width: 350px;
        width: 90%;
        animation: scaleIn 0.3s ease;
      }

      .modal h2 { font-size: 1.8em; margin-bottom: 10px; color: var(--color-deep-ink); }
      .modal p { font-size: 1.2em; color: var(--color-deep-soft); margin: 10px 0; }

      .stars { font-size: 2.5em; margin: 10px 0; }
      .star { color: rgba(255, 246, 234, 0.3); }
      .star.filled { color: #ffd700; }

      .high-score { color: var(--color-primary); font-weight: bold; }

      .modal-btn {
        background: var(--color-primary);
        color: var(--color-deep);
        border: none;
        padding: 12px 25px;
        border-radius: var(--radius-pill);
        font-size: 1.1em;
        font-weight: bold;
        cursor: pointer;
        margin: 5px;
        min-height: 44px;
        box-shadow: 0 4px 0 0 #9a3412;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      .modal-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 0 #9a3412; }

      .modal-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 0 #9a3412; }

      .modal-close {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 1.5em;
        color: var(--color-deep-soft);
        cursor: pointer;
        line-height: 1;
        padding: 0;
        border: none;
        background: transparent;
        font-family: inherit;
      }

      .modal-close:hover {
        color: var(--color-deep-ink);
      }

      .modal {
        position: relative;
      }

      .confetti {
        position: fixed;
        width: 10px; height: 10px;
        top: -10px;
        z-index: 1001;
        animation: confettiFall 3s linear forwards;
      }

      @keyframes scaleIn {
        from { transform: scale(0.8); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }

      @keyframes confettiFall {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
      }

      .timer-bar {
        width: 100%;
        height: 8px;
        background: var(--color-amber-tint);
        border-radius: 4px;
        margin-bottom: 10px;
        overflow: hidden;
      }

      .timer-fill {
        height: 100%;
        background: var(--color-amber);
        transition: width 0.1s linear;
      }

      .feedback {
        min-height: 1.5em;
        margin-bottom: 8px;
        color: var(--color-ink);
        font-size: clamp(0.9em, 3vw, 1.1em);
        font-weight: bold;
        text-align: center;
        z-index: 10;
      }

      .start-overlay {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(255, 248, 239, 0.78);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 15px;
        text-align: center;
        z-index: 50;
      }

      .start-overlay.hidden { display: none; }

      .start-msg {
        font-size: clamp(1.1em, 4vw, 1.4em);
        font-weight: bold;
        color: var(--color-ink);
      }

      .start-btn {
        font-size: clamp(1.2em, 4vw, 1.4em);
        padding: 15px 40px;
      }

      @media (max-width: 480px) {
        body { padding: 5px; padding-top: 35px; }
        .header { margin-bottom: 5px; }
        .header h1 { font-size: 1.2em; }
        .stats { font-size: 0.8em; gap: 10px; margin-bottom: 5px; }
        .game-area { height: calc(100vh - 130px); }
        .balloon { width: 50px; height: 65px; }
        .balloon-body { width: 50px; height: 60px; font-size: 1.2em; }
        .back-link { top: 5px; left: 5px; padding: 5px 8px; font-size: 0.75em; }
        .mode-selector { gap: 5px; margin-bottom: 5px; }
        .mode-btn { padding: 6px 12px; font-size: 0.8em; }
        .controls { margin-top: 8px; }
        .btn { padding: 8px 16px; font-size: 0.85em; }
      }
    </style>
  </head>
  <body>
    <a href="../../" class="back-link">← Back to Games</a>

    <main>
      <div id="srStatus" class="sr-only" role="status" aria-live="polite"></div>

      <div class="header">
        <h1><span aria-hidden="true">🎈</span> Balloon Pop!</h1>
      </div>

      <div class="stats">
        <div>Score: <span id="score">0</span></div>
        <div>Level: <span id="level">1</span></div>
        <div>Best this visit: <span id="best">0</span></div>
      </div>

      <div class="mode-selector">
        <button type="button" class="mode-btn active" aria-pressed="true" onclick="setMode('numbers', this)"><span aria-hidden="true">🔢</span> Numbers</button>
        <button type="button" class="mode-btn" aria-pressed="false" onclick="setMode('letters', this)"><span aria-hidden="true">🔤</span> Letters</button>
        <button type="button" class="mode-btn" aria-pressed="false" onclick="setMode('free', this)"><span aria-hidden="true">🎯</span> Free Pop</button>
      </div>

      <div class="target-display" id="targetDisplay">Pop: <span id="target">1</span></div>

      <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width: 100%"></div></div>

      <div class="feedback" id="feedback"></div>

      <div class="game-area" id="gameArea">
        <div class="start-overlay" id="startOverlay">
          <div class="start-msg">Pop the balloons in order — ready?</div>
          <button type="button" class="btn start-btn" onclick="startGame(true)"><span aria-hidden="true">▶️</span> Start</button>
        </div>
      </div>

      <div class="controls">
        <button type="button" class="btn" onclick="startGame(true)">New Game</button>
      </div>
    </main>

    <div class="modal-overlay" id="modal">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button type="button" class="modal-close" onclick="closeModalOnly()" aria-label="Close">✕</button>
        <h2 id="modalTitle">🎉 Great Job!</h2>
        <div class="stars" id="starRating" aria-hidden="true">
          <span class="star">★</span>
          <span class="star">★</span>
          <span class="star">★</span>
        </div>
        <p>Score: <span id="finalScore">0</span></p>
        <p>Level: <span id="finalLevel">1</span></p>
        <p id="highScoreMsg" class="high-score" style="display: none;">🏆 New best this visit!</p>
        <button type="button" class="modal-btn" id="playAgainBtn" onclick="closeModal()">Play Again</button>
      </div>
    </div>

    <script>
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      let audioCtx = null;

      function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
      }

      function playSound(type) {
        // site-wide sound toggle (components.js)
        if (window.pimwMuted) return;
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'pop') {
          osc.frequency.setValueAtTime(800, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
          osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'wrong') {
          osc.frequency.setValueAtTime(200, audioCtx.currentTime);
          osc.type = 'square';
          gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
          osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        } else if (type === 'levelUp') {
          [523, 659, 784, 1047].forEach((f, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g); g.connect(audioCtx.destination);
            o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.1);
            g.gain.setValueAtTime(0.12, audioCtx.currentTime + i * 0.1);
            g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.15);
            o.start(audioCtx.currentTime + i * 0.1);
            o.stop(audioCtx.currentTime + i * 0.1 + 0.15);
          });
        }
      }

      function createConfetti() {
        const colors = ['#ff6b6b', '#4ecdc4', '#ffd700', '#a8e6cf', '#ff9ff3'];
        for (let i = 0; i < 40; i++) {
          const c = document.createElement('div');
          c.className = 'confetti';
          c.style.left = Math.random() * 100 + 'vw';
          c.style.background = colors[Math.floor(Math.random() * colors.length)];
          c.style.animationDelay = Math.random() * 1.5 + 's';
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 4000);
        }
      }

      const balloonColors = ['#ff6b6b', '#4ecdc4', '#ffd700', '#ff9ff3', '#54a0ff', '#5f27cd', '#00d2d3', '#ff9f43'];
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

      let mode = 'numbers';
      let score = 0, level = 1;
      let currentTarget = 1;
      let maxTarget = 10;
      let timeLeft = 30;
      let timerMax = 30;   // high-water mark, so the bar scales with bonus time
      let gameRunning = false;
      let timerInterval, spawnInterval;
      let best = 0;

      const gameArea = document.getElementById('gameArea');

      // one polite live region: everything a sighted player sees on the
      // board is spoken here, and nowhere else
      function announce(text) {
        const region = document.getElementById('srStatus');
        if (region) region.textContent = text;
      }

      function setMode(m, btn) {
        mode = m;
        document.querySelectorAll('.mode-btn').forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-pressed', 'false');
        });
        if (btn) {
          btn.classList.add('active');
          btn.setAttribute('aria-pressed', 'true');
        }

        if (mode === 'free') {
          document.getElementById('targetDisplay').style.display = 'none';
        } else {
          document.getElementById('targetDisplay').style.display = 'block';
        }
        startGame();
      }

      function updateDisplay() {
        document.getElementById('score').textContent = score;
        document.getElementById('level').textContent = level;
        document.getElementById('best').textContent = best;
        
        if (mode === 'numbers') {
          document.getElementById('target').textContent = currentTarget;
        } else if (mode === 'letters') {
          document.getElementById('target').textContent = letters[currentTarget - 1] || 'A';
        }
      }

      function createBalloon(value, displayValue) {
        const balloon = document.createElement('button');
        balloon.type = 'button';
        balloon.className = 'balloon';
        balloon.dataset.value = value;
        balloon.setAttribute('aria-label', 'Pop balloon ' + displayValue);

        const color = balloonColors[Math.floor(Math.random() * balloonColors.length)];
        
        balloon.innerHTML = `
          <div class="balloon-body" style="background: ${color}; --balloon-color: ${color}">
            ${displayValue}
          </div>
          <div class="balloon-string"></div>
        `;

        const areaWidth = gameArea.offsetWidth - 70;
        const areaHeight = gameArea.offsetHeight - 90;
        balloon.style.left = Math.random() * areaWidth + 'px';
        balloon.style.top = Math.random() * areaHeight + 'px';
        balloon.style.animationDelay = Math.random() * 2 + 's';

        balloon.addEventListener('click', () => popBalloon(balloon, value));
        
        gameArea.appendChild(balloon);
      }

      function popBalloon(balloon, value) {
        if (!gameRunning) return;

        const rect = balloon.getBoundingClientRect();
        const areaRect = gameArea.getBoundingClientRect();
        const x = rect.left - areaRect.left + 30;
        const y = rect.top - areaRect.top + 35;

        if (mode === 'free' || value === currentTarget) {
          // Correct pop
          playSound('pop');
          showPopEffect(x, y);
          showScorePopup(x, y, '+10');

          score += 10;
          // keyboard players must not be dumped back to the top of the page
          // every time a balloon they were standing on disappears
          const hadFocus = document.activeElement === balloon;
          balloon.remove();
          showFeedback('');
          if (hadFocus) {
            const next = document.querySelector('.balloon');
            // preventScroll: the board must not lurch when focus moves
            if (next) next.focus({ preventScroll: true });
          }

          const popped = mode === 'letters' ? letters[value - 1] : value;
          announce(`Popped ${popped}. Plus 10. Score ${score}.`);

          if (mode !== 'free') {
            currentTarget++;
            if (currentTarget > maxTarget) {
              levelUp();
            }
          }

          updateDisplay();
        } else {
          // Wrong balloon: name what they hit and what they need —
          // a buzz alone teaches nothing
          const hit = mode === 'letters' ? letters[value - 1] : value;
          const want = mode === 'letters' ? letters[currentTarget - 1] : currentTarget;
          showFeedback(`That was ${hit} — we're looking for ${want}!`);
          announce(`That was ${hit} — we're looking for ${want}. Minus 5. Score ${Math.max(0, score - 5)}.`);
          playSound('wrong');
          showScorePopup(x, y, '-5');
          score = Math.max(0, score - 5);
          updateDisplay();
          
          balloon.style.animation = 'none';
          balloon.style.transform = 'scale(0.9)';
          setTimeout(() => {
            balloon.style.animation = '';
            balloon.style.transform = '';
          }, 200);
        }
      }

      function showPopEffect(x, y) {
        const effect = document.createElement('div');
        effect.className = 'pop-effect';
        effect.setAttribute('aria-hidden', 'true');
        effect.textContent = '💥';
        effect.style.left = x + 'px';
        effect.style.top = y + 'px';
        gameArea.appendChild(effect);
        setTimeout(() => effect.remove(), 400);
      }

      function showScorePopup(x, y, text) {
        const popup = document.createElement('div');
        popup.className = 'score-popup';
        popup.setAttribute('aria-hidden', 'true');
        popup.textContent = text;
        popup.style.left = x + 'px';
        popup.style.top = y + 'px';
        popup.style.color = text.includes('+') ? '#4ecdc4' : '#ff6b6b';
        gameArea.appendChild(popup);
        setTimeout(() => popup.remove(), 800);
      }

      function levelUp() {
        level++;
        currentTarget = 1;
        maxTarget = Math.min((mode === 'letters' ? 6 : 10) + level * 2, 26);
        timeLeft += 15;
        timerMax = Math.max(timerMax, timeLeft);
        playSound('levelUp');
        createConfetti();
        spawnBalloons();
        updateDisplay();
        announce(`Level ${level}! Fifteen more seconds. Score ${score}.`);
      }

      // Refill without touching balloons already on screen — a full respawn
      // mid-play made the whole board teleport under the child's finger
      function topUpBalloons() {
        const existing = document.querySelectorAll('.balloon');
        const target = Math.min(6 + level, 12);
        let need = target - existing.length;
        if (need <= 0) return;

        const values = [];
        const have = [...existing].map(b => parseInt(b.dataset.value, 10));
        if (mode !== 'free' && !have.includes(currentTarget)) {
          values.push({
            value: currentTarget,
            display: mode === 'letters' ? letters[currentTarget - 1] : currentTarget.toString()
          });
        }
        while (values.length < need) {
          if (mode === 'letters') {
            const rand = Math.floor(Math.random() * maxTarget) + 1;
            values.push({ value: rand, display: letters[rand - 1] });
          } else {
            const pool = mode === 'free' ? 10 : maxTarget;
            const rand = Math.floor(Math.random() * pool) + 1;
            values.push({ value: rand, display: rand.toString() });
          }
        }
        values.forEach(v => createBalloon(v.value, v.display));
      }

      function showFeedback(text) {
        document.getElementById('feedback').textContent = text;
      }

      function spawnBalloons() {
        // Clear existing balloons
        document.querySelectorAll('.balloon').forEach(b => b.remove());

        const count = Math.min(6 + level, 12);
        const values = [];

        if (mode === 'numbers') {
          for (let i = currentTarget; i <= Math.min(currentTarget + count - 1, maxTarget); i++) {
            values.push({ value: i, display: i.toString() });
          }
          // Add some random numbers
          while (values.length < count) {
            const rand = Math.floor(Math.random() * maxTarget) + 1;
            values.push({ value: rand, display: rand.toString() });
          }
        } else if (mode === 'letters') {
          for (let i = currentTarget; i <= Math.min(currentTarget + count - 1, 26); i++) {
            values.push({ value: i, display: letters[i - 1] });
          }
          while (values.length < count) {
            const rand = Math.floor(Math.random() * 26) + 1;
            values.push({ value: rand, display: letters[rand - 1] });
          }
        } else {
          // Free mode - random balloons
          for (let i = 0; i < count; i++) {
            const rand = Math.floor(Math.random() * 10) + 1;
            values.push({ value: rand, display: rand.toString() });
          }
        }

        // Shuffle
        values.sort(() => Math.random() - 0.5);

        values.forEach(v => createBalloon(v.value, v.display));
      }

      function updateTimer() {
        timeLeft -= 0.1;
        // measured against the most time this run has held, not a fixed 30 —
        // a level-up adds 15s, which used to peg the bar at full and make it
        // look frozen until the clock dropped back under 30
        timerMax = Math.max(timerMax, timeLeft);
        const percent = (timeLeft / timerMax) * 100;
        document.getElementById('timerFill').style.width =
          Math.min(100, Math.max(0, percent)) + '%';

        if (timeLeft <= 0) {
          endGame();
        }
      }

      function startGame(focusBoard) {
        clearInterval(timerInterval);
        clearInterval(spawnInterval);
        document.querySelectorAll('.balloon').forEach(b => b.remove());
        document.getElementById('modal').classList.remove('show');

        score = 0;
        level = 1;
        currentTarget = 1;
        // letters start with a small pool (A-F) and grow each level —
        // starting at all 26 made level 2's "10 + level*2" a step backwards
        maxTarget = mode === 'letters' ? 6 : 10;
        timeLeft = 30;
        timerMax = 30;
        gameRunning = true;
        document.getElementById('startOverlay').classList.add('hidden');
        showFeedback('');

        updateDisplay();
        spawnBalloons();

        // the Start button just vanished with the overlay — hand the keyboard
        // straight to the board instead of stranding focus on <body>
        if (focusBoard) {
          const first = document.querySelector('.balloon');
          if (first) first.focus({ preventScroll: true });
        }
        announce(
          mode === 'free'
            ? 'New game. Pop any balloon. Thirty seconds.'
            : `New game. Pop ${mode === 'letters' ? letters[currentTarget - 1] : currentTarget} first. Thirty seconds.`
        );

        timerInterval = setInterval(updateTimer, 100);
        spawnInterval = setInterval(() => {
          if (gameRunning && document.querySelectorAll('.balloon').length < 6) {
            topUpBalloons();
          }
        }, 3000);
      }

      function endGame() {
        gameRunning = false;
        clearInterval(timerInterval);
        clearInterval(spawnInterval);
        // the Start overlay returns behind the modal, so closing the modal
        // never strands the child on a dead board
        document.getElementById('startOverlay').classList.remove('hidden');

        const isNewBest = score > best;
        if (isNewBest) {
          best = score;
        }

        document.getElementById('finalScore').textContent = score;
        document.getElementById('finalLevel').textContent = level;
        document.getElementById('highScoreMsg').style.display = isNewBest ? 'block' : 'none';

        const stars = document.querySelectorAll('#starRating .star');
        const starCount = score >= 300 ? 3 : score >= 150 ? 2 : 1;
        stars.forEach((s, i) => s.classList.toggle('filled', i < starCount));

        document.getElementById('modal').classList.add('show');
        announce(
          `Time up! Game over. Score ${score}, level ${level}, ${starCount} ${starCount === 1 ? 'star' : 'stars'}.` +
          (isNewBest ? ' New best this visit!' : '')
        );
        // send the keyboard into the dialog that just appeared
        document.getElementById('playAgainBtn').focus();
        if (score >= 150) createConfetti();
      }

      function closeModalOnly() {
        document.getElementById('modal').classList.remove('show');
      }

      function closeModalOnOverlay(event) {
        if (event.target === event.currentTarget) {
          closeModalOnly();
          document.querySelector('.controls .btn').focus();
        }
      }

      function closeModal() {
        closeModalOnly();
        startGame(true);
      }

      // backdrop click and Escape both dismiss the dialog — no inline handler
      // on a plain <div>, which no keyboard could ever reach
      document.getElementById('modal').addEventListener('click', closeModalOnOverlay);

      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        const modal = document.getElementById('modal');
        if (!modal.classList.contains('show')) return;
        closeModalOnly();
        document.querySelector('.controls .btn').focus();
      });

      // no auto-start: the 30-second timer only runs once a child chooses to
      // begin — the board waits behind the Start overlay until then
      updateDisplay();
    </script>

    <script>
      /* Installed-app flag: drives the bottom bar. display-mode covers Android
         and modern iOS; navigator.standalone is the older iOS signal. */
      if (
        (window.matchMedia && matchMedia("(display-mode: standalone)").matches) ||
        navigator.standalone
      ) {
        document.documentElement.classList.add("pimw-installed");
      }
      /* Back, with a floor: a game opened directly from a search result has no
         history to go back to, so fall through to the games index. */
      function pimwBack() {
        if (history.length > 1) history.back();
        else location.href = "/games/";
      }
      /* offline support; skipped over file:// where service workers do not run */
      if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
        addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
