    <style>
      body {
        font-family: var(--font-display);
        background: var(--color-bg);
        color: var(--color-ink);
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 18px;
        line-height: 1.6;
      }

      button {
        font-family: var(--font-display);
      }

      .header {
        text-align: center;
        color: var(--color-ink);
        margin-bottom: 25px;
      }

      .header h1 {
        font-size: clamp(26px, 7vw, 34px);
        font-weight: 700;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 16px;
        font-weight: 500;
        color: var(--color-ink-soft);
      }

      .drawing-container {
        background: var(--color-surface);
        border-radius: var(--radius-lg);
        padding: 20px;
        box-shadow: var(--shadow-rest);
        max-width: 800px;
        width: 100%;
      }

      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 10px;
      }

      .color-palette {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }

      /* the pad keeps the same column layout the body used to give its
         children directly — the main landmark is semantics, not a new look */
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      /* announced by screen readers, invisible on screen */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      .color-btn {
        width: 30px;
        height: 30px;
        border: 3px solid #333;
        border-radius: 50%;
        cursor: pointer;
        transition: transform 0.2s;
        /* real <button>s now, so the UA chrome is reset to keep the swatch
           exactly 30px of colour inside its 3px ring */
        padding: 0;
        font: inherit;
        -webkit-appearance: none;
        appearance: none;
      }

      .color-btn:hover {
        transform: scale(1.1);
      }

      .color-btn:active {
        transform: scale(0.92) translateY(1px);
      }

      .color-btn.active {
        border-color: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      }

      .brush-controls {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brush-size {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      .brush-preview {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid var(--color-ink);
      }

      .canvas-container {
        position: relative;
        border: 3px solid var(--color-ink);
        border-radius: var(--radius-md);
        overflow: hidden;
        background: white;
        width: 100%;
        max-width: 700px;
        margin: 0 auto;
      }

      #drawingCanvas {
        display: block;
        cursor: crosshair;
        touch-action: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        width: 100%;
        height: auto;
        max-width: 100%;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      .btn {
        background: var(--color-teal);
        color: #fff;
        border: none;
        padding: 12px 24px;
        border-radius: var(--radius-pill);
        min-height: 44px;

        font-weight: 600;

        transition: transform 120ms ease, box-shadow 120ms ease;
        box-shadow: 0 4px 0 0 #0b4f4a;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 0 0 #0b4f4a;
      }

      .btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 0 #0b4f4a;
      }

      .back-link {
        position: absolute;
        top: 20px;
        left: 20px;
        color: var(--color-teal);
        text-decoration: none;
        font-size: 15px;

        align-items: center;
        box-shadow: 0 3px 0 0 #99e5d3;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      .back-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 0 0 #99e5d3;
      }

      .back-link:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 0 #99e5d3;
      }

      .stamp-container {
        display: flex;

      .stamp-btn {

        color: var(--color-teal);

        /* real <button>s now — match the <div> metrics they replaced */

        line-height: inherit;
        -webkit-appearance: none;
        appearance: none;

      .stamp-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 0 0 #99e5d3;

      .stamp-btn:active {

        box-shadow: 0 1px 0 0 #99e5d3;

      .stamp-btn.active {
        background: var(--color-teal);
        color: #fff;
        box-shadow: 0 4px 0 0 #0b4f4a;
      }

      .stamp-btn.active:active {
        box-shadow: 0 1px 0 0 #0b4f4a;
      }

      .eraser-btn {
        padding: 5px 10px;
        min-height: 44px;
        min-width: 44px;
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: transform 120ms ease, box-shadow 120ms ease;
        background: var(--color-teal-tint);
        color: var(--color-teal);
        box-shadow: 0 3px 0 0 #99e5d3;
        font-size: 14px;
        /* real <button> now — match the <div> metrics it replaced */
        font-family: inherit;
        line-height: inherit;
        -webkit-appearance: none;
        appearance: none;
      }

      .eraser-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 0 0 #99e5d3;
      }

      .eraser-btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 0 #99e5d3;
      }

      .eraser-btn.active {
        background: var(--color-teal);
        color: #fff;
        box-shadow: 0 4px 0 0 #0b4f4a;
      }

      .eraser-btn.active:active {
        box-shadow: 0 1px 0 0 #0b4f4a;
      }

      @media (max-width: 768px) {
        body {
          padding: 10px;
          padding-top: 60px; /* Space for back link */
        }

        .drawing-container {
          padding: 15px;
          margin: 0 5px;
        }

        .toolbar {
          flex-direction: column;
          gap: 15px;
          align-items: center;
        }

        .color-palette {
          justify-content: center;
        }

        .color-btn {
          width: 25px;
          height: 25px;
        }

        .brush-controls {
          flex-direction: column;
          gap: 10px;
        }

        .stamp-container {
          flex-wrap: wrap;
          justify-content: center;
        }

        .stamp-btn {
          font-size: 20px;
          padding: 8px 12px;
        }

        .eraser-btn {
          padding: 8px 12px;
          font-size: 12px;
        }

        .btn {
          padding: 8px 15px;
          font-size: clamp(0.8em, 3vw, 1em);
          margin: 5px;
        }

        .back-link {
          top: 10px;
          left: 10px;
          font-size: clamp(0.9em, 3vw, 1em);
          padding: 8px 12px;
        }

        #drawingCanvas {
          max-width: 100%;
          height: auto;
        }

        .controls {
          flex-direction: column;
          align-items: center;
          gap: 10px;
        }
      }

      @media (max-width: 480px) {
        body {
          padding-top: 50px; /* Less space on smaller screens */
        }

        .toolbar {
          gap: 10px;
        }

        .color-btn {
          width: 20px;
          height: 20px;
        }

        .stamp-btn {
          font-size: 18px;
          padding: 6px 10px;
        }

        .controls {
          gap: 10px;
        }

        .btn {
          margin: 3px;
        }
      }

      /* Prevent text selection on mobile */
      .color-btn,
      .stamp-btn,
      .eraser-btn,
      .btn,
      .slider {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        touch-action: manipulation;
      }
    </style>

          <button type="button" class="stamp-btn" data-stamp="🌸" aria-pressed="false" aria-label="Flower stamp">🌸</button>
          <button type="button" class="eraser-btn" id="eraserBtn" aria-pressed="false" aria-label="Eraser">🧽</button>

      <div class="canvas-container">
        <canvas
          id="drawingCanvas"
          role="img"
          aria-label="Drawing canvas. Draw here with a mouse, a finger or a stylus."
        ></canvas>
      </div>

      <div class="controls">
        <button type="button" class="btn clear" onclick="clearCanvas()">Clear Canvas</button>
        <button type="button" class="btn" onclick="downloadDrawing()">Download</button>

    <script>
      const canvas = document.getElementById("drawingCanvas");
      const ctx = canvas.getContext("2d");

      let isDrawing = false;
      let currentColor = "#000000";
      let currentBrushSize = 5;
      let currentStamp = null;
      let isEraser = false;

      // Responsive canvas setup
      function resizeCanvas() {
        const container = canvas.parentElement;
        const containerWidth = container.clientWidth - 40; // Account for padding
        const containerHeight = Math.min(
          containerWidth * 0.7,
          window.innerHeight * 0.5
        );

        // No-op if the canvas pixel dimensions are unchanged
        const targetWidth = Math.floor(containerWidth);
        const targetHeight = Math.floor(containerHeight);
        if (canvas.width === targetWidth && canvas.height === targetHeight) {
          return;
        }

        // Preserve the current artwork before resizing
        let snapshot = null;
        if (canvas.width > 0 && canvas.height > 0) {
          snapshot = document.createElement("canvas");
          snapshot.width = canvas.width;
          snapshot.height = canvas.height;
          snapshot.getContext("2d").drawImage(canvas, 0, 0);
        }

        canvas.width = containerWidth;
        canvas.height = containerHeight;

        // Set canvas display size
        canvas.style.width = containerWidth + "px";
        canvas.style.height = containerHeight + "px";

        // Reinitialize canvas with white background
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw the preserved artwork back at a uniform scale, centred —
        // stretching to fill would distort the drawing when rotation
        // changes the canvas aspect ratio
        if (snapshot) {
          const scale = Math.min(
            canvas.width / snapshot.width,
            canvas.height / snapshot.height
          );
          const w = snapshot.width * scale;
          const h = snapshot.height * scale;
          ctx.drawImage(snapshot, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
        }
      }

      // Initialize canvas
      resizeCanvas();

      // Resize canvas on window resize
      window.addEventListener("resize", resizeCanvas);

      // one polite live region: every tool change a sighted child sees in the
      // toolbar is spoken here
      function announce(text) {
        const region = document.getElementById("srStatus");
        if (region) region.textContent = text;
      }

      // the "active" class is the only thing that used to say which tool is
      // chosen — mirror it into aria-pressed so it is not a colour-only cue
      function setActive(el, on) {
        el.classList.toggle("active", on);
        el.setAttribute("aria-pressed", on ? "true" : "false");
      }

      function clearActive(selector) {
        document.querySelectorAll(selector).forEach((el) => setActive(el, false));
      }

      // Color selection
      document.querySelectorAll(".color-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          clearActive(".color-btn");
          setActive(btn, true);
          currentColor = btn.dataset.color;
          isEraser = false;
          setActive(document.getElementById("eraserBtn"), false);
          clearActive(".stamp-btn");
          currentStamp = null;
          updateBrushPreview();
          announce(`${btn.getAttribute("aria-label")} pen selected.`);
        });
      });

      // Brush size
      document.getElementById("brushSize").addEventListener("input", (e) => {
        currentBrushSize = parseInt(e.target.value);
        updateBrushPreview();
        announce(`Brush size ${currentBrushSize}.`);
      });

      // Stamp selection
      document.querySelectorAll(".stamp-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          clearActive(".stamp-btn");
          setActive(btn, true);
          currentStamp = btn.dataset.stamp;
          isEraser = false;
          setActive(document.getElementById("eraserBtn"), false);
          clearActive(".color-btn");
          updateBrushPreview();
          announce(`${btn.getAttribute("aria-label")} selected.`);
        });
      });

      // Eraser
      document.getElementById("eraserBtn").addEventListener("click", () => {
        const eraserBtn = document.getElementById("eraserBtn");
        setActive(eraserBtn, !eraserBtn.classList.contains("active"));
        isEraser = eraserBtn.classList.contains("active");
        if (isEraser) {
          clearActive(".stamp-btn");
          clearActive(".color-btn");
          currentStamp = null;
        }
        // without this the preview's isEraser branch never ran, so the swatch
        // kept showing the last colour while the eraser was active
        updateBrushPreview();
        announce(isEraser ? "Eraser on." : "Eraser off.");
      });

      function updateBrushPreview() {
        const preview = document.getElementById("brushPreview");
        preview.style.width = currentBrushSize + "px";
        preview.style.height = currentBrushSize + "px";
        preview.style.background = isEraser ? "#ff6b6b" : currentColor;
      }

      // Enhanced touch and mouse drawing
      function getPointerPosition(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        let clientX, clientY;

        if (e.touches && e.touches[0]) {
          // Touch event
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        } else if (e.changedTouches && e.changedTouches[0]) {
          // Touch end event
          clientX = e.changedTouches[0].clientX;
          clientY = e.changedTouches[0].clientY;
        } else {
          // Mouse or pointer event
          clientX = e.clientX;
          clientY = e.clientY;
        }

        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY,
        };
      }

      function startDrawing(e) {
        e.preventDefault();
        isDrawing = true;
        const pos = getPointerPosition(e);

        if (currentStamp) {
          drawStamp(pos.x, pos.y);
        } else {
          ctx.beginPath();
          ctx.moveTo(pos.x, pos.y);
        }
      }

      function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();

        const pos = getPointerPosition(e);

        if (currentStamp) {
          drawStamp(pos.x, pos.y);
        } else if (isEraser) {
          drawEraser(pos.x, pos.y);
        } else {
          drawLine(pos.x, pos.y);
        }
      }

      function stopDrawing(e) {
        if (e) e.preventDefault();
        isDrawing = false;
        ctx.beginPath();
      }

      function drawStamp(x, y) {
        ctx.save();
        ctx.font = currentBrushSize * 2 + "px Arial";
        ctx.fillStyle = currentColor;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(currentStamp, x, y);
        ctx.restore();
      }

      function drawEraser(x, y) {
        ctx.save();
        ctx.globalCompositeOperation = "destination-out";
        ctx.lineWidth = currentBrushSize;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.restore();
      }

      function drawLine(x, y) {
        ctx.lineWidth = currentBrushSize;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = currentColor;
        ctx.lineTo(x, y);
        ctx.stroke();
      }

      // Unified event handling for both mouse and touch
      let pointerSupported = false;

      // Check if pointer events are supported
      if (window.PointerEvent) {
        pointerSupported = true;
        canvas.addEventListener("pointerdown", startDrawing);
        canvas.addEventListener("pointermove", draw);
        canvas.addEventListener("pointerup", stopDrawing);
        canvas.addEventListener("pointercancel", stopDrawing);
        canvas.addEventListener("pointerout", stopDrawing);
        canvas.addEventListener("pointerleave", stopDrawing);
      } else {
        // Fallback to mouse and touch events
        // Mouse events
        canvas.addEventListener("mousedown", startDrawing);
        canvas.addEventListener("mousemove", draw);
        canvas.addEventListener("mouseup", stopDrawing);
        canvas.addEventListener("mouseout", stopDrawing);

        // Touch events
        canvas.addEventListener("touchstart", startDrawing, { passive: false });
        canvas.addEventListener("touchmove", draw, { passive: false });
        canvas.addEventListener("touchend", stopDrawing, { passive: false });
        canvas.addEventListener("touchcancel", stopDrawing, { passive: false });
      }

      function clearCanvas() {
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        announce("Canvas cleared. Blank page ready.");
      }

      function downloadDrawing() {
        try {
          // Create canvas data URL
          const dataURL = canvas.toDataURL("image/png");
          announce("Saving your drawing.");

          // For mobile browsers, we need a different approach
          if (
            /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
              navigator.userAgent
            )
          ) {
            // Mobile approach - open in new tab and let user save manually
            const newWindow = window.open();
            newWindow.document.write(`
              <html>
                <head>
                  <title>Download Drawing</title>
                  <style>
