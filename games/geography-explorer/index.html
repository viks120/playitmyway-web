    <script>
      // Sound effects using Web Audio API
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      let audioCtx = null;

      function initAudio() {
        if (!audioCtx) {
          audioCtx = new AudioContext();
        }
      }

      function playSound(type) {
        initAudio();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        switch(type) {
          case 'correct':
            const notes = [523, 659, 784];
            notes.forEach((freq, i) => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
              osc.type = 'sine';
              gain.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.1);
              gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.2);
              osc.start(audioCtx.currentTime + i * 0.1);
              osc.stop(audioCtx.currentTime + i * 0.1 + 0.2);
            });
            return;
          case 'wrong':
            oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime + 0.1);
            oscillator.type = 'square';
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
            break;
          case 'levelUp':
            const levelNotes = [523, 659, 784, 1047];
            levelNotes.forEach((freq, i) => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.15);
              osc.type = 'sine';
              gain.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.15);
              gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.3);
              osc.start(audioCtx.currentTime + i * 0.15);
              osc.stop(audioCtx.currentTime + i * 0.15 + 0.3);
            });
            return;
        }
      }

      function createConfetti() {
        const colors = ['#ff6b6b', '#4ecdc4', '#ffd700', '#a8e6cf', '#ff9ff3', '#54a0ff'];
        for (let i = 0; i < 50; i++) {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.left = Math.random() * 100 + 'vw';
          confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.animationDelay = Math.random() * 2 + 's';
          confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
          document.body.appendChild(confetti);
          setTimeout(() => confetti.remove(), 5000);
        }
      }

      function displayStars(count) {
        const stars = document.querySelectorAll('#starRating .star');
        stars.forEach((star, i) => {
          star.classList.toggle('filled', i < count);
        });

        playSound('levelUp');
        createConfetti();

          },
          {
            name: "Egypt",
            capital: "Cairo",
            continent: "Africa",
            flag: "🇪🇬",
            hint: "Famous for pyramids and the Nile River",
          },
        ],
      };

      const continentPositions = {
        "North America": {
          top: "20%",
          left: "15%",
          width: "25%",
          height: "35%",
        },
        "South America": {
          top: "55%",
          left: "25%",
          width: "20%",
          height: "35%",
        },
        Europe: { top: "15%", left: "45%", width: "20%", height: "25%" },
        Africa: { top: "40%", left: "45%", width: "25%", height: "35%" },
        Asia: { top: "20%", left: "70%", width: "25%", height: "40%" },
        Oceania: { top: "60%", left: "75%", width: "20%", height: "25%" },
      };

      function setMode(mode) {
        currentMode = mode;

        // Update active button
        document.querySelectorAll(".mode-btn").forEach((btn) => {
          btn.classList.remove("active");
        });
        event.target.classList.add("active");

        // Generate new challenge
        newChallenge();
      }

      function createWorldMap() {
        const mapContainer = document.getElementById("worldMap");
        mapContainer.innerHTML = "";

        Object.entries(continentPositions).forEach(([continent, pos]) => {
          const continentDiv = document.createElement("div");
          continentDiv.className = "continent";
          continentDiv.textContent = continent;
          continentDiv.style.top = pos.top;
          continentDiv.style.left = pos.left;
          continentDiv.style.width = pos.width;
          continentDiv.style.height = pos.height;
          continentDiv.dataset.continent = continent;

          continentDiv.addEventListener("click", () =>
            checkContinentAnswer(continent, continentDiv)
          );

          mapContainer.appendChild(continentDiv);
        });
      }

      function generateCountryChallenge() {
        const country =
          geographyDatabase.countries[
            Math.floor(Math.random() * geographyDatabase.countries.length)
          ];
        const question = `Find ${country.name} on the map`;

        document.getElementById("question").textContent = question;
        document.getElementById("flagDisplay").textContent = country.flag;

        // Show the world map for country challenges
        document.getElementById("worldMap").style.display = "block";

        // Create answer options (continents)
        const continents = Object.keys(continentPositions);
        const answerOptions = document.getElementById("answerOptions");
        answerOptions.innerHTML = "";

        continents.forEach((continent) => {
          const btn = document.createElement("button");
          btn.className = "answer-btn";
          btn.textContent = continent;
          btn.onclick = () => checkAnswer(continent, btn);
          answerOptions.appendChild(btn);
        });

        return { country, correctAnswer: country.continent };
      }

      function generateCapitalChallenge() {
        const country =
          geographyDatabase.countries[
            Math.floor(Math.random() * geographyDatabase.countries.length)
          ];
        const question = `What is the capital of ${country.name}?`;

        document.getElementById("question").textContent = question;
        document.getElementById("flagDisplay").textContent = country.flag;

        // Hide the world map for capital challenges
        document.getElementById("worldMap").style.display = "none";

        // Create answer options (capitals)
        const allCapitals = geographyDatabase.countries.map((c) => c.capital);
        const shuffledCapitals = allCapitals
          .sort(() => Math.random() - 0.5)
          .slice(0, 4);

        if (!shuffledCapitals.includes(country.capital)) {
          shuffledCapitals[0] = country.capital;
        }

        const answerOptions = document.getElementById("answerOptions");
        answerOptions.innerHTML = "";

        shuffledCapitals
          .sort(() => Math.random() - 0.5)
          .forEach((capital) => {
            const btn = document.createElement("button");
            btn.className = "answer-btn";
            btn.textContent = capital;
            btn.onclick = () => checkAnswer(capital, btn);
            answerOptions.appendChild(btn);
          });

        return { country, correctAnswer: country.capital };
      }

      function generateFlagChallenge() {
        const country =
          geographyDatabase.countries[
            Math.floor(Math.random() * geographyDatabase.countries.length)
          ];
        const question = `Which country does this flag belong to?`;

        document.getElementById("question").textContent = question;
        document.getElementById("flagDisplay").textContent = country.flag;

        // Hide the world map for flag challenges
        document.getElementById("worldMap").style.display = "none";

        // Create answer options (countries)
        const allCountries = geographyDatabase.countries.map((c) => c.name);
        const shuffledCountries = allCountries
          .sort(() => Math.random() - 0.5)
          .slice(0, 4);

        if (!shuffledCountries.includes(country.name)) {
          shuffledCountries[0] = country.name;
        }

        const answerOptions = document.getElementById("answerOptions");
        answerOptions.innerHTML = "";

        shuffledCountries
          .sort(() => Math.random() - 0.5)
          .forEach((countryName) => {
            const btn = document.createElement("button");
            btn.className = "answer-btn";
            btn.textContent = countryName;
            btn.onclick = () => checkAnswer(countryName, btn);
            answerOptions.appendChild(btn);
          });

        return { country, correctAnswer: country.name };
      }

      function newChallenge() {
        hintsUsed = 0;
        attemptCount = 0;
        questionOver = false;

        switch (currentMode) {
          case "countries":
            currentChallenge = generateCountryChallenge();
            break;
          case "capitals":
            currentChallenge = generateCapitalChallenge();
            break;
          case "flags":
            currentChallenge = generateFlagChallenge();
            break;
        }

        // Clear feedback, hint and reset map
        if (feedbackTimer) {
          clearTimeout(feedbackTimer);
          feedbackTimer = null;
        }
        document.getElementById("feedback").style.display = "none";
        document.getElementById("hint").style.display = "none";
        document.getElementById("hintBtn").disabled = false;
        document.getElementById("nextBtn").style.display = "none";
        document.querySelectorAll(".continent").forEach((c) => {
          c.classList.remove("correct", "incorrect", "eliminated");
        });
        document.querySelectorAll(".answer-btn").forEach((btn) => {
          btn.classList.remove("correct", "incorrect", "eliminated");
          btn.disabled = false;
        });
      }

      function showFeedback(message, type, autoHideMs) {
        const feedback = document.getElementById("feedback");
        if (feedbackTimer) {
          clearTimeout(feedbackTimer);
          feedbackTimer = null;
        }
        feedback.textContent = message;
        feedback.className = "feedback" + (type ? " " + type : "");
        feedback.style.display = "block";
        if (autoHideMs) {
          feedbackTimer = setTimeout(() => {
            feedback.style.display = "none";
            feedbackTimer = null;
          }, autoHideMs);
        }
      }

      function showHint(message) {
        const hintElement = document.getElementById("hint");
        hintElement.textContent = message;
        hintElement.style.display = "block";
      }

      function findOptionElements(value) {
        const matches = [];
        document.querySelectorAll("#answerOptions .answer-btn").forEach((btn) => {
          if (btn.textContent === value) matches.push(btn);
        });
        if (currentMode === "countries") {
          const continentEl = document.querySelector(
            '.continent[data-continent="' + value + '"]'
          );
          if (continentEl) matches.push(continentEl);
        }
        return matches;
      }

      function eliminationHint(selected) {
        const country = currentChallenge.country;
        let reason = country.hint;
        if (!reason) {
          if (currentMode === "capitals") {
            reason = `The capital starts with "${country.capital[0]}"`;
          } else if (currentMode === "flags") {
            reason = `This country is in ${country.continent}`;
          } else {
            reason = `The continent starts with "${country.continent[0]}"`;
          }
        }
        return `💡 It's not ${selected}! Hint: ${reason}`;
      }

      function lockQuestion() {
        questionOver = true;
        document.querySelectorAll("#answerOptions .answer-btn").forEach((btn) => {
          btn.disabled = true;
        });
        document.getElementById("hintBtn").disabled = true;
        document.getElementById("nextBtn").style.display = "inline-block";
      }

      function checkAnswer(selected, element) {
        if (questionOver || element.classList.contains("eliminated")) {
          return;
        }

        const isCorrect = selected === currentChallenge.correctAnswer;

        if (isCorrect) {
          // Correct answer: full points first try, half on second, never negative
          playSound('correct');
          const basePoints = Math.max(0, 50 - hintsUsed * 10);
          const points =
            attemptCount === 0
              ? basePoints
              : Math.max(0, Math.floor(basePoints / 2));
          score += points;
          countriesFound++;

          const previousLevel = level;
          if (countriesFound >= level * 5) {
            level++;
          }

          updateStats();

          showFeedback(`🎉 Correct! +${points} points`, "correct");

          // Highlight correct answer
          findOptionElements(selected).forEach((el) =>
            el.classList.add("correct")
          );
          lockQuestion();

          if (level > previousLevel) {
            showLevelModal();
          }
        } else {
          playSound('wrong');
          attemptCount++;

          if (attemptCount === 1) {
            // First miss: grey out the chosen option and hint — no reveal yet
            findOptionElements(selected).forEach((el) => {
              el.classList.add("eliminated");
              if (el.tagName === "BUTTON") el.disabled = true;
            });
            showHint(eliminationHint(selected));
            showFeedback("😅 Not quite — try again!", "incorrect", 2000);
          } else {
            // Second miss: reveal the answer with the country's fun fact
            const country = currentChallenge.country;
            findOptionElements(selected).forEach((el) =>
              el.classList.add("incorrect")
            );
            findOptionElements(currentChallenge.correctAnswer).forEach((el) =>
              el.classList.add("correct")
            );
            showFeedback(
              `The answer is ${currentChallenge.correctAnswer}! 🌍 ${country.name}: ${country.hint}`,
              "reveal"
            );
            lockQuestion();
          }
        }
      }

      function checkContinentAnswer(selectedContinent, continentElement) {
        if (currentMode === "countries") {
          checkAnswer(selectedContinent, continentElement);
        }
      }

      function getHint() {
        if (hintsUsed >= 1 || questionOver) {
          return;
        }
        hintsUsed++;
        document.getElementById("hintBtn").disabled = true;
        showHint(`💡 Hint: ${currentChallenge.country.hint}`);
      }

      function updateStats() {
        document.getElementById("score").textContent = score;
        document.getElementById("level").textContent = level;
        document.getElementById("found").textContent = countriesFound;
      }

      // Initialize game
      createWorldMap();
      newChallenge();
    </script>
  </body>
</html>
