      .game-container {
        background: rgba(255, 255, 255, 0.95);
        padding: 20px;
        border-radius: 15px;

      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        background: #bbada0;
        padding: 10px;
        border-radius: 10px;
        /* tiles are absolutely-positioned children, so the grid anchors them */
        position: relative;
        /* the game needs swipes in all four directions, so the board must
           own every gesture that starts on it — the rest of the page still
           scrolls normally */
        touch-action: none;
      }

      /* Tiles live in a layer above the background cells and slide between
         positions with a transform, so a move glides instead of teleporting.
         .cell.tile so this outranks .cell's position: relative */
      .cell.tile {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 2;
        transition: transform 0.15s ease;
      }

      .cell {
        width: 80px;
        height: 80px;
        background: #cdc1b4;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        font-weight: bold;
        color: #776e65;
        transition: all 0.15s ease;
        position: relative;
      }

      .cell[data-value="2"] {
        background: #eee4da;
      }
      .cell[data-value="4"] {
        background: #ede0c8;
      }
      .cell[data-value="8"] {
        background: #f2b179;
        color: #f9f6f2;
      }
      .cell[data-value="16"] {
        background: #f59563;
        color: #f9f6f2;
      }
      .cell[data-value="32"] {
        background: #f67c5f;
        color: #f9f6f2;
      }
      .cell[data-value="64"] {
        background: #f65e3b;
        color: #f9f6f2;
      }
      .cell[data-value="128"] {
        background: #edcf72;
        color: #f9f6f2;
        font-size: 1.6rem;
      }
      .cell[data-value="256"] {
        background: #edcc61;
        color: #f9f6f2;
        font-size: 1.6rem;
      }
      .cell[data-value="512"] {
        background: #edc850;
        color: #f9f6f2;
        font-size: 1.6rem;
      }
      .cell[data-value="1024"] {
        background: #edc53f;
        color: #f9f6f2;
        font-size: 1.4rem;
      }
      .cell[data-value="2048"] {
        background: #edc22e;
        color: #f9f6f2;
        font-size: 1.4rem;
      }
      /* "Keep going" runs past 2048, so the bigger tiles need colours too */
      .cell[data-value="4096"],
      .cell[data-value="8192"],
      .cell[data-value="16384"] {
        background: #3c3a32;
        color: #f9f6f2;
        font-size: 1.2rem;
      }

      .cell.new {
        animation: pop 0.3s ease;
      }

      .cell.merged {
        animation: merge 0.3s ease;
      }

      @keyframes pop {
        0% {
          transform: scale(0);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes merge {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cell.tile {
          transition: none;
        }
        .cell.new,
        .cell.merged {
          animation: none;
        }
      }

    <script>
      // Sound effects using Web Audio API
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      let audioCtx = null;

      function initAudio() {
        if (!audioCtx) {
          audioCtx = new AudioContext();
        }
      }

      function playSound(type) {
        // site-wide sound toggle (components.js)
        if (window.pimwMuted) return;
        initAudio();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        switch(type) {
          case 'move':
            oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.05);
            break;
          case 'merge':
            oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
            oscillator.frequency.setValueAtTime(500, audioCtx.currentTime + 0.05);
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
            break;
          case 'win':
            const winNotes = [523, 659, 784, 1047];
            winNotes.forEach((freq, i) => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.15);
              osc.type = 'sine';
              gain.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.15);
              gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.3);
              osc.start(audioCtx.currentTime + i * 0.15);
              osc.stop(audioCtx.currentTime + i * 0.15 + 0.3);
            });
            return;
          case 'gameOver':
            oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
            oscillator.frequency.setValueAtTime(200, audioCtx.currentTime + 0.2);
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime + 0.4);
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.6);
            break;
        }
      }

      function createConfetti() {
        const colors = ['#ff6b6b', '#4ecdc4', '#ffd700', '#a8e6cf', '#ff9ff3', '#54a0ff'];
        for (let i = 0; i < 50; i++) {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.left = Math.random() * 100 + 'vw';
          confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.animationDelay = Math.random() * 2 + 's';
          confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
          document.body.appendChild(confetti);
          setTimeout(() => confetti.remove(), 5000);
        }
      }

      // Announcements for a player who can't watch the tiles glide: the same
      // events a sighted player sees — score moving, tiles merging, game over.
      let announcedScore = 0;
      function announce(msg) {
        const el = document.getElementById("srStatus");
        if (!el) return;
        // identical consecutive text is not re-announced, so alternate a space
        el.textContent = el.textContent === msg ? msg + " " : msg;
      }

      function displayStars(score) {
        const stars = document.querySelectorAll('#starRating .star');
        const starCount = score >= 10000 ? 3 : score >= 5000 ? 2 : 1;
        stars.forEach((star, i) => {
          star.classList.toggle('filled', i < starCount);
        });
      }

      class Game2048 {
        constructor() {
          this.grid = Array(4)
            .fill()
            .map(() => Array(4).fill(0));
          this.score = 0;
          this.best = 0;
          this.newBestThisGame = false;
          this.gameOver = false;
          this.eventListenersAdded = false;
          this.tiles = [];
          this.tileId = 0;
          this.merges = 0;
          this.keptGoing = false;
          this.pendingFinalize = null;
          this.reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          this.init();
        }

        init() {
          this.buildBackground();
          this.tiles.forEach((t) => t.el.remove());
          this.tiles = [];
          this.updateBest();
          this.updateScore();
          this.addRandomTile();
          this.addRandomTile();
          if (!this.eventListenersAdded) {
            this.setupEventListeners();
            this.eventListenersAdded = true;
          }
        }

        // The 16 grid cells are a static backdrop, built once; the moving
        // tiles are an absolutely-positioned layer above them
        buildBackground() {
          const gridElement = document.getElementById("grid");
          if (this.bgCells) return;
          gridElement.innerHTML = "";
          this.bgCells = [];
          for (let n = 0; n < 16; n++) {
            const cell = document.createElement("div");
            cell.className = "cell";
            gridElement.appendChild(cell);
            this.bgCells.push(cell);
          }
        }

        cellAt(i, j) {
          return this.bgCells[i * 4 + j];
        }

        placeTile(t) {
          const c = this.cellAt(t.i, t.j);
          t.el.style.width = c.offsetWidth + "px";
          t.el.style.height = c.offsetHeight + "px";
          t.el.style.transform = "translate(" + c.offsetLeft + "px, " + c.offsetTop + "px)";
        }

        // reposition every tile with no glide (window resized / rotated)
        relayout() {
          this.tiles.forEach((t) => {
            t.el.style.transition = "none";
            this.placeTile(t);
          });
          void document.getElementById("grid").offsetWidth;
          this.tiles.forEach((t) => {
            t.el.style.transition = "";
          });
        }

        setupEventListeners() {
          // tiles are pinned to pixel positions, so a resize or rotation
          // must re-anchor them to their cells (instantly, no glide)
          window.addEventListener("resize", () => this.relayout());

          document.addEventListener("keydown", (e) => {
            if (this.gameOver) return;

            switch (e.key) {
              case "ArrowUp":
                e.preventDefault();
                this.move("up");
                break;
              case "ArrowDown":
                e.preventDefault();
                this.move("down");
                break;
              case "ArrowLeft":
                e.preventDefault();
                this.move("left");
                break;
              case "ArrowRight":
                e.preventDefault();
                this.move("right");
                break;
            }
          });

          // Touch events for mobile. These live on the GRID, not the document:
          // on the document every scroll of the page counted as a swipe and
          // moved the tiles, and swiping the board scrolled the page as well.
          const grid = document.getElementById("grid");
          let startX = null;
          let startY = null;
          const minSwipeDistance = 30; // Minimum distance for a swipe

          grid.addEventListener(
            "touchstart",
            (e) => {
              if (e.touches.length !== 1) { startX = startY = null; return; }
              startX = e.touches[0].clientX;
              startY = e.touches[0].clientY;
              // claim the gesture before the browser can start scrolling
              if (e.cancelable) e.preventDefault();
            },
            { passive: false }
          );

          grid.addEventListener(
            "touchmove",
            (e) => {
              if (startX !== null && e.cancelable) e.preventDefault();
            },
            { passive: false }
          );

          grid.addEventListener("touchend", (e) => {
            if (startX === null || startY === null || this.gameOver) {
              startX = startY = null;
              return;
            }

            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;

            const diffX = startX - endX;
            const diffY = startY - endY;

            startX = startY = null;

            // Only register swipe if it's longer than minimum distance
            if (Math.abs(diffX) < minSwipeDistance && Math.abs(diffY) < minSwipeDistance) {
              return;
            }

            if (Math.abs(diffX) > Math.abs(diffY)) {
              if (diffX > 0) this.move("left");
              else this.move("right");
            } else {
              if (diffY > 0) this.move("up");
              else this.move("down");
            }
          });

          grid.addEventListener("touchcancel", () => {
            startX = startY = null;
          });

          // Some Android browsers ignore overscroll-behavior, so block
          // pull-to-refresh directly: a single-finger downward move while the
          // page is already at the top can only be the refresh gesture.
          let ptrStartY = 0;
          document.addEventListener(
            "touchstart",
            (e) => {
              ptrStartY = e.touches[0].clientY;
            },
            { passive: true }
          );
          document.addEventListener(
            "touchmove",
            (e) => {
              if (
                e.touches.length === 1 &&
                window.scrollY <= 0 &&
                e.touches[0].clientY > ptrStartY &&
                e.cancelable
              ) {
                e.preventDefault();
              }
            },
            { passive: false }
          );
        }

        addRandomTile() {
          const emptyCells = [];
          for (let i = 0; i < 4; i++) {
            for (let j = 0; j < 4; j++) {
              if (this.grid[i][j] === 0) {
                emptyCells.push({ i, j });
              }
            }
          }

          if (emptyCells.length > 0) {
            const { i, j } =
              emptyCells[Math.floor(Math.random() * emptyCells.length)];
            const value = Math.random() < 0.9 ? 2 : 4;
            this.grid[i][j] = value;
            this.spawnTileEl(i, j, value);
          }
        }

        spawnTileEl(i, j, value) {
          const t = { id: ++this.tileId, value, i, j, el: document.createElement("div") };
          t.el.className = "cell tile new";
          t.el.textContent = value;
          t.el.setAttribute("data-value", value);
          document.getElementById("grid").appendChild(t.el);
          t.el.style.transition = "none";
          this.placeTile(t);
          void t.el.offsetWidth;
          t.el.style.transition = "";
          this.tiles.push(t);
          return t;
        }

        // One slide routine for all four directions, operating on tile
        // objects so each one knows where it moved and what it merged into.
        // Merge order matches the old per-direction code: the pair nearest
        // the edge tiles move toward merges first, one merge per tile per move.
        slide(direction) {
          const horizontal = direction === "left" || direction === "right";
          const forward = direction === "left" || direction === "up";
          let moved = false;
          const absorbed = [];

          for (let line = 0; line < 4; line++) {
            const lineTiles = this.tiles
              .filter((t) => (horizontal ? t.i === line : t.j === line))
              .sort((a, b) => {
                const pa = horizontal ? a.j : a.i;
                const pb = horizontal ? b.j : b.i;
                return forward ? pa - pb : pb - pa;
              });

            let slot = forward ? 0 : 3;
            let prev = null;
            for (const t of lineTiles) {
              if (prev && prev.value === t.value && !prev.mergedThisMove) {
                // glide onto the tile we merge with, then vanish into it
                t.mergeInto = prev;
                t.i = prev.i;
                t.j = prev.j;
                prev.value *= 2;
                prev.mergedThisMove = true;
                this.score += prev.value;
                this.merges++;
                absorbed.push(t);
                moved = true;
              } else {
                const from = horizontal ? t.j : t.i;
                if (horizontal) t.j = slot; else t.i = slot;
                if (from !== slot) moved = true;
                slot += forward ? 1 : -1;
                prev = t;
              }
            }
          }

          // survivors define the new grid; absorbed tiles leave it
          this.tiles = this.tiles.filter((t) => !t.mergeInto);
          this.grid = Array(4).fill().map(() => Array(4).fill(0));
          this.tiles.forEach((t) => {
            t.mergedThisMove = false;
            this.grid[t.i][t.j] = t.value;
          });

          return { moved, absorbed };
        }

        move(direction) {
          if (this.gameOver) return;
          this.finalizeNow();
          const { moved, absorbed } = this.slide(direction);
          if (!moved) return;

          playSound('move');
          this.tiles.forEach((t) => this.placeTile(t));
          absorbed.forEach((t) => this.placeTile(t));
          this.updateScore();

          // after the glide: absorbed tiles vanish, survivors pulse with
          // their doubled value, and the new tile pops in
          const finish = () => {
            this.pendingFinalize = null;
            absorbed.forEach((t) => {
              t.el.remove();
              const winner = t.mergeInto;
              winner.el.textContent = winner.value;
              winner.el.setAttribute("data-value", winner.value);
              winner.el.classList.remove("merged");
              void winner.el.offsetWidth;
              winner.el.classList.add("merged");
            });
            this.addRandomTile();
            this.checkGameOver();
          };
          if (this.reduced) {
            finish();
          } else {
            const timer = setTimeout(finish, 170);
            this.pendingFinalize = () => {
              clearTimeout(timer);
              finish();
            };
          }
        }

        // a fresh move mid-animation completes the previous one instantly,
        // so rapid play can never desync tiles from the grid
        finalizeNow() {
          if (this.pendingFinalize) this.pendingFinalize();
        }

        updateScore() {
          document.getElementById("score").textContent = this.score;
          this.updateBest();
          // score only ever climbs on a merge, so the rise is the merge result
          const gained = this.score - announcedScore;
          announcedScore = this.score;
          if (gained > 0) {
            const biggest = Math.max.apply(null, [].concat.apply([], this.grid));
            announce(
              "Merged for " + gained + " points. Score " + this.score +
              ". Biggest tile " + biggest + "."
            );
          }
        }

        updateBest() {
          if (this.score > this.best) {
            this.best = this.score;
            // remembered so the game-over modal can celebrate after
            // best has already been synced to the final score
            this.newBestThisGame = true;
          }
          document.getElementById("best").textContent = this.best;
        }

        checkGameOver() {
          // Reaching 2048 celebrates once — "Keep going" then lets the run
          // continue toward 4096 instead of force-ending a best game
          if (!this.keptGoing) {
            for (let i = 0; i < 4; i++) {
              for (let j = 0; j < 4; j++) {
                if (this.grid[i][j] >= 2048) {
                  this.showGameOver(
                    "You Win!",
                    "Congratulations! You reached 2048!"
                  );
                  return;
                }
              }
            }
          }

          // Check if no moves are possible
          if (!this.canMove()) {
            this.showGameOver("Game Over!", "No more moves possible!");
          }
        }

        canMove() {
          // Check for empty cells
          for (let i = 0; i < 4; i++) {
            for (let j = 0; j < 4; j++) {
              if (this.grid[i][j] === 0) return true;
            }
          }

          // Check for possible merges
          for (let i = 0; i < 4; i++) {
            for (let j = 0; j < 4; j++) {
              const current = this.grid[i][j];
              if (j < 3 && this.grid[i][j + 1] === current) return true;
              if (i < 3 && this.grid[i + 1][j] === current) return true;
            }
          }

          return false;
        }

        showGameOver(title, message) {
          this.gameOver = true;
          document.getElementById("gameOverTitle").textContent = title;
          document.getElementById("gameOverMessage").innerHTML = `Your final score: <span id="finalScore">${this.score}</span>`;
          
          displayStars(this.score);
          
          // updateBest() has already synced best to the final score, so
          // compare via the flag it sets, not the (now equal) values
          const highScoreMsg = document.getElementById("highScoreMsg");
          if (this.newBestThisGame && this.score > 0) {
            highScoreMsg.style.display = "block";
          } else {
            highScoreMsg.style.display = "none";
          }
          
          // one true line of maths from the game the child just played
          const maxTile = Math.max.apply(null, [].concat.apply([], this.grid));
          const mathFact = document.getElementById("mathFact");
          if (maxTile >= 4) {
            mathFact.innerHTML =
              "Biggest tile " + maxTile + " = 2<sup>" + Math.log2(maxTile) + "</sup>" +
              " · you merged " + this.merges + (this.merges === 1 ? " time" : " times");
          } else {
            mathFact.textContent = "";
          }
          document.getElementById("keepGoingBtn").style.display =
            title === "You Win!" ? "inline-block" : "none";

          document.getElementById("gameOver").classList.add("show");
          announce(title + " " + message + " Final score " + this.score + ".");

          if (title === "You Win!") {
            playSound('win');
            createConfetti();
          } else {
            playSound('gameOver');
          }
        }

        reset() {
          this.finalizeNow();
          this.grid = Array(4)
            .fill()
            .map(() => Array(4).fill(0));
          this.score = 0;
          this.newBestThisGame = false;
          this.gameOver = false;
          this.merges = 0;
          this.keptGoing = false;
          document.getElementById("gameOver").classList.remove("show");
          this.init();
        }
      }

      let game;

      function newGame() {
        if (game) {
          game.reset();
        } else {
          game = new Game2048();
        }
      }

      function keepGoing() {
        if (!game) return;
        game.keptGoing = true;
        game.gameOver = false;
        document.getElementById("gameOver").classList.remove("show");
      }

      function showInstructions() {
        alert(`How to play 2048:

• Use arrow keys or swipe to move tiles
• Tiles with the same number merge when they touch
• Try to reach the 2048 tile!
• Game ends when no more moves are possible

Good luck!`);
      }

      // Initialize game when page loads
      window.addEventListener("load", () => {
        game = new Game2048();
      });
    </script>
    <script src="../../components.js"></script>

  </body>
</html>
