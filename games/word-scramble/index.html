    <script>
      // Sound effects using Web Audio API
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      let audioCtx = null;

      function initAudio() {
        if (!audioCtx) {
          audioCtx = new AudioContext();
        }
      }

      function playSound(type) {
        initAudio();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        switch(type) {
          case 'correct':
            const notes = [523, 659, 784];
            notes.forEach((freq, i) => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
              osc.type = 'sine';
              gain.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.1);
              gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.2);
              osc.start(audioCtx.currentTime + i * 0.1);
              osc.stop(audioCtx.currentTime + i * 0.1 + 0.2);
            });
            return;
          case 'wrong':
            oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime + 0.1);
            oscillator.type = 'square';
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
            break;
          case 'levelUp':
            const levelNotes = [523, 659, 784, 1047];
            levelNotes.forEach((freq, i) => {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.15);
              osc.type = 'sine';
              gain.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.15);
              gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.3);
              osc.start(audioCtx.currentTime + i * 0.15);
              osc.stop(audioCtx.currentTime + i * 0.15 + 0.3);
            });
            return;
          case 'click':
            oscillator.frequency.setValueAtTime(500, audioCtx.currentTime);
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.05);
            break;
        }
      }

      function createConfetti() {
        const colors = ['#ff6b6b', '#4ecdc4', '#ffd700', '#a8e6cf', '#ff9ff3', '#54a0ff'];
        for (let i = 0; i < 50; i++) {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.left = Math.random() * 100 + 'vw';
          confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.animationDelay = Math.random() * 2 + 's';
          confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
          document.body.appendChild(confetti);
          setTimeout(() => confetti.remove(), 5000);
        }
      }

      function displayStars(count) {
        const stars = document.querySelectorAll('#starRating .star');
        stars.forEach((star, i) => {
          star.classList.toggle('filled', i < count);
        });
      }

      function showLevelModal() {
        const modal = document.getElementById('levelModal');
        document.getElementById('modalTitle').textContent = `🎊 Level ${level}!`;

        document.getElementById('modalLevel').textContent = level;
        document.getElementById('modalSolved').textContent = wordsSolved;
        document.getElementById('modalStreak').textContent = bestStreak;

        const starCount = Math.min(3, level);
        displayStars(starCount);

        const highScoreMsg = document.getElementById('highScoreMsg');
        if (score > bestScore) {
          bestScore = score;
          highScoreMsg.style.display = 'block';
        } else {
          highScoreMsg.style.display = 'none';
        }

        modal.classList.add('show');
        playSound('levelUp');
        createConfetti();
      }

        document.getElementById('levelModal').classList.remove('show');

            word: "MOUNTAIN",
            category: "Nature",
            hint: "Very tall natural elevation of land",
          },
          {
            word: "BUTTERFLY",
            category: "Animals",
            hint: "Colorful insect with large wings",
          },
          {
            word: "ADVENTURE",
            category: "Activities",
            hint: "Exciting journey or experience",
          },
          {
            word: "BEAUTIFUL",
            category: "Descriptions",
            hint: "Pleasant to look at",
          },
          {
            word: "HAPPINESS",
            category: "Emotions",
            hint: "Feeling of joy and contentment",
          },
          {
            word: "KNOWLEDGE",
            category: "Education",
            hint: "Information and understanding",
          },
        ],
      };

      function setDifficulty(difficulty) {
        currentDifficulty = difficulty;

        // Update active button
        document.querySelectorAll(".difficulty-btn").forEach((btn) => {
          btn.classList.remove("active");
        });
        event.target.classList.add("active");

        // Reset streak and start new word
        resetStreak();
        newWord();
      }

      function scrambleWord(word) {
        const letters = word.split("");
        // a "scramble" identical to the answer reads as a solved puzzle
        // (about 1 in 6 for three-letter words) — reshuffle unless the word
        // has no distinct arrangement at all (e.g. "aaa")
        for (let attempt = 0; attempt < 20; attempt++) {
          for (let i = letters.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [letters[i], letters[j]] = [letters[j], letters[i]];
          }
          if (letters.join("") !== word) break;
        }
        return letters.join("");
      }

      // Shared placement/removal used by mouse clicks, taps and drops, so
      // every input method mutates the tray/slot model the same way
      function placeTileInFirstEmptySlot(tileEl) {
        if (wordComplete) return false;
        const letterIndex = parseInt(tileEl.dataset.index);
        if (scrambledLetters[letterIndex].used) return false;
        const emptySlot = answerSlots.find((slot) => !slot.filled);
        if (!emptySlot) return false;
        emptySlot.element.textContent = tileEl.textContent;
        emptySlot.element.classList.add("filled");
        emptySlot.filled = true;
        emptySlot.currentLetter = tileEl.textContent;
        emptySlot.tileIndex = letterIndex;
        scrambledLetters[letterIndex].used = true;
        tileEl.style.display = "none";
        return true;
      }

      function removeLetterFromSlot(slotEl) {
        if (wordComplete) return false;
        if (!slotEl.classList.contains("filled")) return false;
        const slotIndex = parseInt(slotEl.dataset.index);
        const slot = answerSlots[slotIndex];
        // restore the exact tile that filled this slot; letters placed by
        // the hint helper carry no tile identity, so fall back to matching
        // by letter for those
        let tile =
          slot.tileIndex !== undefined ? scrambledLetters[slot.tileIndex] : null;
        if (!tile || !tile.used || tile.letter !== slot.currentLetter) {
          tile = scrambledLetters.find(
            (item) => item.letter === slot.currentLetter && item.used
          );
        }
        if (tile) {
          tile.used = false;
          tile.element.style.display = "flex";
        }
        slotEl.textContent = "";
        slotEl.classList.remove("filled");
        slot.filled = false;
        slot.currentLetter = "";
        delete slot.tileIndex;
        return true;
      }

      function createLetterTile(letter, index) {
        const tile = document.createElement("div");
        tile.className = "letter-tile";
        tile.textContent = letter;
        tile.draggable = true;
        tile.dataset.index = index;

        // Drag and drop functionality
        tile.addEventListener("dragstart", handleDragStart);
        tile.addEventListener("dragend", handleDragEnd);

        // Mouse: click a letter to drop it into the next empty slot —
        // the game was drag-only on desktop
        tile.addEventListener("click", function () {
          placeTileInFirstEmptySlot(this);
        });

        // Touch support for mobile
        tile.addEventListener("touchstart", handleTouchStart);
        tile.addEventListener("touchmove", handleTouchMove);
        tile.addEventListener("touchend", handleTouchEnd);

        return tile;
      }

      function createAnswerSlot(index) {
        const slot = document.createElement("div");
        slot.className = "answer-slot";
        slot.dataset.index = index;

        // Drop functionality
        slot.addEventListener("dragover", handleDragOver);
        slot.addEventListener("drop", handleDrop);

        // Mouse: click a filled slot to send its letter back to the tray —
        // there was previously no way to undo a placement on desktop
        slot.addEventListener("click", function () {
          removeLetterFromSlot(this);
        });

        // Touch support for mobile
        slot.addEventListener("touchstart", handleTouchStart);
        slot.addEventListener("touchmove", handleTouchMove);
        slot.addEventListener("touchend", handleTouchEnd);

        return slot;
      }

      function generateNewWord() {
        const words = wordDatabase[currentDifficulty];
        const randomIndex = Math.floor(Math.random() * words.length);
        const wordData = words[randomIndex];

        currentWord = wordData.word;
        currentHint = wordData.hint;
        document.getElementById(
          "category"
        ).textContent = `Category: ${wordData.category}`;
        document.getElementById("hint").textContent = `Hint: ${wordData.hint}`;

        // Clear previous letters and slots
        const scrambledContainer = document.getElementById("scrambledLetters");
        const answerContainer = document.getElementById("answerArea");

        scrambledContainer.innerHTML = "";
        answerContainer.innerHTML = "";

        // Create scrambled letters
        const scrambled = scrambleWord(currentWord);
        scrambledLetters = scrambled.split("").map((letter, index) => ({
          letter: letter,
          used: false,
          element: createLetterTile(letter, index),
        }));

        scrambledLetters.forEach((item) => {
          scrambledContainer.appendChild(item.element);
        });

        // Create answer slots
        answerSlots = currentWord.split("").map((letter, index) => ({
          letter: letter,
          filled: false,
          element: createAnswerSlot(index),
        }));

        answerSlots.forEach((slot) => {
          answerContainer.appendChild(slot.element);
        });

        // Clear feedback
        document.getElementById("feedback").style.display = "none";
      }

      function checkAnswer() {
        if (wordComplete) return;

        // Only a full word counts as an attempt
        if (answerSlots.some((slot) => !slot.filled)) {
          clearTimeout(feedbackTimer);
          document.getElementById("feedback").textContent = "🧩 Place all the letters first!";
          document.getElementById("feedback").className = "feedback incorrect";
          document.getElementById("feedback").style.display = "block";

          feedbackTimer = setTimeout(() => {
            document.getElementById("feedback").style.display = "none";
          }, 2000);
          return;
        }

        const currentAnswer = answerSlots
          .map((slot) => (slot.filled ? slot.currentLetter : ""))
          .join("");

        if (currentAnswer === currentWord) {
          // Correct answer
          playSound('correct');
          wordComplete = true;
          streak++;
          if (streak > bestStreak) bestStreak = streak;
          document.getElementById('streak').textContent = streak;
          if (streak >= 2) {
            document.getElementById('streakIndicator').classList.add('show');
          }

          // Full points first try, half after a wrong try — never negative
          let basePoints = currentWord.length * 10;
          if (failedAttempts >= 1) {
            basePoints = Math.floor(basePoints / 2);
          }
          const streakBonus = streak >= 3 ? streak * 5 : 0;
          const points = Math.max(0, basePoints + streakBonus);
          score += points;
          wordsSolved++;

          const previousLevel = level;
          if (wordsSolved >= level * 5) {
            level++;
          }

          updateStats();

          const feedbackText = streak >= 3
            ? `🔥 ${streak} in a row! +${points} points!`
            : `🎉 Correct! +${points} points`;
          clearTimeout(feedbackTimer);
          document.getElementById("feedback").textContent = feedbackText;
          document.getElementById("feedback").className = "feedback correct";
          document.getElementById("feedback").style.display = "block";

          document.getElementById("hintStatus").textContent = "";
          document.getElementById("showMeBtn").style.display = "none";

          if (level > previousLevel) {
            showLevelModal();
          } else {
            document.getElementById("nextBtn").style.display = "inline-block";
          }
        } else {
          // Incorrect answer
          playSound('wrong');
          streak = 0;
          document.getElementById('streak').textContent = streak;
          document.getElementById('streakIndicator').classList.remove('show');
          failedAttempts++;

          // Persistent helper message — stays until the child acts
          const placedCount = answerSlots.filter(
            (slot, i) => slot.filled && slot.currentLetter === currentWord[i]
          ).length;
          const hintStatusEl = document.getElementById("hintStatus");
          if (failedAttempts >= 3) {
            document.getElementById("showMeBtn").style.display = "inline-block";
            hintStatusEl.textContent = `🤗 Tricky one! ${placedCount} of ${currentWord.length} letters are in the right spot. Tap "Show Me 👀" to see the answer, or keep trying!`;
          } else if (placedCount > 0) {
            hintStatusEl.textContent = `📍 ${placedCount} of ${currentWord.length} letters are in the right spot — keep going!`;
          } else {
            hintStatusEl.textContent = "📍 No letters are in the right spot yet — try a different order!";
          }

          clearTimeout(feedbackTimer);
          document.getElementById("feedback").textContent = "😅 Not quite — try again!";
          document.getElementById("feedback").className = "feedback incorrect";
          document.getElementById("feedback").style.display = "block";

          feedbackTimer = setTimeout(() => {
            document.getElementById("feedback").style.display = "none";
          }, 2000);
        }
      }

      function getHint() {
        if (wordComplete) return;

        const hintStatusEl = document.getElementById("hintStatus");

        if (hintsUsed >= MAX_HINTS) {
          hintStatusEl.textContent = "🙈 No more letter hints for this word — you can do it!";
          return;
        }

        // Find the first slot that doesn't hold its correct letter yet
        let targetIndex = -1;
        for (let i = 0; i < answerSlots.length; i++) {
          if (!answerSlots[i].filled || answerSlots[i].currentLetter !== currentWord[i]) {
            targetIndex = i;
            break;
          }
        }

        if (targetIndex === -1) {
          hintStatusEl.textContent = "🌟 Every letter is in place — press Check Answer!";
          return;
        }

        const neededLetter = currentWord[targetIndex];
        const targetSlot = answerSlots[targetIndex];

        // If the slot holds a wrong letter, send it back to the tray first
        if (targetSlot.filled) {
          const wrongTile = scrambledLetters.find(
            (item) => item.letter === targetSlot.currentLetter && item.used
          );
          if (wrongTile) {
            wrongTile.used = false;
            wrongTile.element.style.display = "flex";
          }
          targetSlot.element.textContent = "";
          targetSlot.element.classList.remove("filled");
          targetSlot.filled = false;
          targetSlot.currentLetter = "";
        }

        // Take the needed letter from the tray, or rescue it from a wrong slot
        let tile = scrambledLetters.find(
          (item) => item.letter === neededLetter && !item.used
        );
        if (!tile) {
          const wrongIndex = answerSlots.findIndex(
            (slot, i) =>
              i !== targetIndex &&
              slot.filled &&
              slot.currentLetter === neededLetter &&
              currentWord[i] !== neededLetter
          );
          if (wrongIndex !== -1) {
            const wrongSlot = answerSlots[wrongIndex];
            tile = scrambledLetters.find(
              (item) => item.letter === neededLetter && item.used
            );
            wrongSlot.element.textContent = "";
            wrongSlot.element.classList.remove("filled");
            wrongSlot.filled = false;
            wrongSlot.currentLetter = "";
          }
        }
        if (!tile) return; // Safety net — every word letter has a tile

        // Small fixed cost — score never drops below zero
        score = Math.max(0, score - HINT_COST);
        updateStats();
        hintsUsed++;

        // Place the correct letter into its slot
        tile.used = true;
        tile.element.style.display = "none";
        targetSlot.element.textContent = neededLetter;
        targetSlot.element.classList.add("filled");
        targetSlot.filled = true;
        targetSlot.currentLetter = neededLetter;

        const hintsLeft = MAX_HINTS - hintsUsed;
        hintStatusEl.textContent = `💡 Letter ${targetIndex + 1} is "${neededLetter}" (-${HINT_COST} points). ${hintsLeft} letter hint${hintsLeft === 1 ? "" : "s"} left for this word.`;
        playSound('click');
      }

      function showMe() {
        if (wordComplete) return;
        wordComplete = true;

        // Reveal the whole word — every slot gets its correct letter
        scrambledLetters.forEach((item) => {
          item.used = true;
          item.element.style.display = "none";
        });
        answerSlots.forEach((slot, i) => {
          const letter = currentWord[i];
          slot.element.textContent = letter;
          slot.element.classList.add("filled");
          slot.filled = true;
          slot.currentLetter = letter;
        });

        streak = 0;
        document.getElementById('streak').textContent = streak;
        document.getElementById('streakIndicator').classList.remove('show');

        document.getElementById("hintStatus").textContent = "";
        clearTimeout(feedbackTimer);
        document.getElementById("feedback").textContent = `👀 The word was ${currentWord} — ${currentHint}. No points this time, but the next one is yours!`;
        document.getElementById("feedback").className = "feedback correct";
        document.getElementById("feedback").style.display = "block";

        document.getElementById("showMeBtn").style.display = "none";
        document.getElementById("nextBtn").style.display = "inline-block";
      }

      function newWord() {
        hintsUsed = 0;
        failedAttempts = 0;
        wordComplete = false;
        document.getElementById("hintStatus").textContent = "";
        document.getElementById("showMeBtn").style.display = "none";
        document.getElementById("nextBtn").style.display = "none";
        generateNewWord();
      }

      function resetStreak() {
        streak = 0;
        bestStreak = 0;
        document.getElementById('streak').textContent = 0;
        document.getElementById('streakIndicator').classList.remove('show');
      }

      function updateStats() {
        document.getElementById("score").textContent = score;
        document.getElementById("level").textContent = level;
        document.getElementById("solved").textContent = wordsSolved;
      }

      // Drag and Drop functionality
      let draggedElement = null;

      function handleDragStart(e) {
        draggedElement = this;
        this.classList.add("dragging");
      }

      function handleDragEnd(e) {
        this.classList.remove("dragging");
      }

      function handleDragOver(e) {
        e.preventDefault();
      }

      function handleDrop(e) {
        e.preventDefault();
        if (
          draggedElement &&
          draggedElement.classList.contains("letter-tile")
        ) {
          const letterIndex = parseInt(draggedElement.dataset.index);
          const slotIndex = parseInt(this.dataset.index);

          if (
            !wordComplete &&
            !answerSlots[slotIndex].filled &&
            !scrambledLetters[letterIndex].used
          ) {
            // Place letter in slot
            this.textContent = draggedElement.textContent;
            this.classList.add("filled");
            answerSlots[slotIndex].filled = true;
            answerSlots[slotIndex].currentLetter = draggedElement.textContent;
            answerSlots[slotIndex].tileIndex = letterIndex;
            scrambledLetters[letterIndex].used = true;
            draggedElement.style.display = "none";
          }
        }
      }

      // Touch functionality for mobile
      let touchStartX = 0;
      let touchStartY = 0;
      let touchElement = null;

      function handleTouchStart(e) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchElement = this;
      }

      function handleTouchMove(e) {
        e.preventDefault();
      }

      function handleTouchEnd(e) {
        if (!touchElement) return;

        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;

        // Check if it's a tap (minimal movement)
        const deltaX = Math.abs(touchEndX - touchStartX);
        const deltaY = Math.abs(touchEndY - touchStartY);

        if (deltaX < 10 && deltaY < 10) {
          // Handle tap through the shared helpers; when a tap does the work,
          // suppress the synthetic click that follows so it can't act twice
          let handled = false;
          if (touchElement.classList.contains("letter-tile")) {
            handled = placeTileInFirstEmptySlot(touchElement);
          } else if (touchElement.classList.contains("answer-slot")) {
            handled = removeLetterFromSlot(touchElement);
          }
          if (handled && e.cancelable) e.preventDefault();
        }

        touchElement = null;
      }

      // Initialize game
      newWord();
    </script>
  </body>
</html>
