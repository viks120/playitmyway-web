    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: var(--font-display);
        background: var(--color-bg);
        color: var(--color-ink);
        margin: 0;
        padding: 10px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 18px;
      }

      button { font-family: var(--font-display); }

      .header {
        text-align: center;
        color: var(--color-ink);
        margin-bottom: 20px;
      }

      .header h1 {
        font-size: clamp(1.8em, 6vw, 2.5em);
        font-weight: 700;
        margin-bottom: 5px;
      }

      .header p {
        font-size: clamp(1em, 3vw, 1.2em);
        color: var(--color-ink-soft);
      }

      .stats {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        color: var(--color-amber);
        font-size: clamp(1em, 3vw, 1.2em);
        font-weight: bold;
      }

      .stats > div {
        background: var(--color-amber-tint);
        padding: 6px 14px;
        border-radius: var(--radius-pill);
      }

      .mode-selector {
        margin-bottom: 20px;
        text-align: center;
      }

      .mode-btn {
        background: var(--color-amber-tint);
        color: var(--color-amber);
        border: none;
        padding: 10px 20px;
        border-radius: var(--radius-pill);
        font-size: clamp(0.9em, 3vw, 1.1em);
        font-weight: bold;
        cursor: pointer;
        margin: 5px;
        min-height: 44px;
        box-shadow: 0 3px 0 0 #fde68a;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      .mode-btn.active {
        background: var(--color-amber);
        color: #ffffff;
        box-shadow: 0 3px 0 0 #7c3a06;
      }

      .mode-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 0 0 #fde68a;
      }

      .mode-btn.active:hover { box-shadow: 0 5px 0 0 #7c3a06; }

      .mode-btn:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 0 #fde68a;
      }

      .mode-btn.active:active { box-shadow: 0 1px 0 0 #7c3a06; }

      .game-container {
        background: var(--color-surface);
        border-radius: var(--radius-lg);
        padding: 20px;
        box-shadow: var(--shadow-rest);
      }

      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 20px;
      }

      .cell {
        width: 90px;
        height: 90px;
        background: linear-gradient(45deg, #f0f0f0, #e0e0e0);
        border: 3px solid #333;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3em;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s ease;
        user-select: none;
      }

      .cell:hover:not(.taken) {
        background: linear-gradient(45deg, #e8e8e8, #d8d8d8);
        transform: scale(1.05);
      }

      .cell.taken {
        cursor: not-allowed;
      }

      .cell.x {
        color: #ff6b6b;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      }

      .cell.o {
        color: #4ecdc4;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
      }

      .cell.winning {
        background: linear-gradient(45deg, #a8e6cf, #88d8c0);
        animation: pulse 0.5s ease infinite alternate;
      }

      @keyframes pulse {
        from { transform: scale(1); }
        to { transform: scale(1.05); }
      }

      .status {
        text-align: center;
        font-size: clamp(1.2em, 4vw, 1.5em);
        font-weight: bold;
        color: var(--color-ink);
        margin-bottom: 15px;
        min-height: 40px;
      }

      .controls {
        text-align: center;
      }

      .btn {
        background: var(--color-amber);
        color: #ffffff;
        border: none;
        padding: 12px 24px;
        border-radius: var(--radius-pill);
        font-size: clamp(1em, 3vw, 1.1em);
        font-weight: bold;
        cursor: pointer;
        min-height: 44px;
        box-shadow: 0 4px 0 0 #7c3a06;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 0 0 #7c3a06;
      }

      .btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 0 #7c3a06;
      }

      .back-link {
        position: absolute;
        top: 15px;
        left: 15px;
        color: var(--color-amber);
        text-decoration: none;
        font-weight: 600;
        font-size: clamp(0.9em, 3vw, 1em);
        background: var(--color-amber-tint);
        padding: 8px 12px;
        border-radius: var(--radius-pill);
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        box-shadow: 0 3px 0 0 #fde68a;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      .back-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 0 0 #fde68a;
      }

      .back-link:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 0 #fde68a;
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }

      .modal-overlay.show {
        display: flex;
      }

      .modal {
        background: var(--color-deep);
        border-radius: var(--radius-lg);
        padding: 30px;
        text-align: center;
        max-width: 350px;
        width: 90%;
        animation: scaleIn 0.3s ease;
      }

      .modal h2 {
        font-size: 1.8em;
        margin-bottom: 15px;
        color: var(--color-deep-ink);
      }

      .modal p {
        color: var(--color-deep-soft);
      }

      .modal-btn {
        background: var(--color-primary);
        color: var(--color-deep);
        border: none;
        padding: 12px 25px;
        border-radius: var(--radius-pill);
        font-size: 1.1em;
        font-weight: bold;
        cursor: pointer;
        margin: 5px;
        min-height: 44px;
        box-shadow: 0 4px 0 0 #9a3412;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      .modal-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 0 0 #9a3412;
      }

      .modal-btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 0 #9a3412;
      }

      .modal-close {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 1.5em;
        color: var(--color-deep-soft);
        cursor: pointer;
        line-height: 1;
        /* real <button> now — strip the UA chrome so it looks as it always did */
        background: none;
        border: none;
        padding: 0;
        font-family: inherit;
      }

      .modal-close:hover {
        color: var(--color-deep-ink);
      }

      .modal {
        position: relative;
      }

      .confetti {
        position: fixed;
        width: 10px;
        height: 10px;
        top: -10px;
        z-index: 1001;
        animation: confettiFall 3s linear forwards;
      }

      /* <main> takes over the column stacking body was doing, so nothing shifts */
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      .visually-hidden {
        position: absolute;
        width: 1px; height: 1px;
        margin: -1px; padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes scaleIn {
        from { transform: scale(0.8); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }

      @keyframes confettiFall {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
      }

      @media (max-width: 480px) {
        body { padding: 5px; padding-top: 35px; }
        .header { margin-bottom: 5px; }
        .header h1 { font-size: 1.2em; }
        .header p { font-size: 0.85em; margin: 3px 0; }
        .cell { width: 70px; height: 70px; font-size: 2.2em; }
        .stats { flex-direction: row; gap: 10px; font-size: 0.85em; margin-bottom: 8px; }
        .back-link { top: 5px; left: 5px; padding: 5px 8px; font-size: 0.75em; }
        .game-board { gap: 8px; }
        .controls { margin-top: 10px; }
        .btn { padding: 10px 18px; font-size: 0.9em; }
      }
    </style>

  <body>
    <a href="../../" class="back-link">← Back to Games</a>

    <main>
      <p class="visually-hidden" id="srStatus" aria-live="polite"></p>

      <div class="header">
        <h1><span aria-hidden="true">⭕</span> Tic Tac Toe <span aria-hidden="true">❌</span></h1>
        <p>Get three in a row to win!</p>
      </div>

      <div class="stats">
        <div>❌ Wins: <span id="xWins">0</span></div>
        <div>⭕ Wins: <span id="oWins">0</span></div>
        <div>Draws: <span id="draws">0</span></div>
      </div>

      <div class="mode-selector">
        <button type="button" class="mode-btn active" aria-pressed="true" onclick="setMode('friend', this)"><span aria-hidden="true">👫</span> vs Friend</button>
        <button type="button" class="mode-btn" aria-pressed="false" onclick="setMode('computer', this)"><span aria-hidden="true">🤖</span> vs Computer</button>
      </div>

      <div class="game-container">
        <div class="status" id="status">❌ Player X's turn</div>
        <div class="board" id="board"></div>
        <div class="controls">
          <button type="button" class="btn" onclick="resetGame()">New Game</button>
          <button type="button" class="btn" onclick="resetScores()">Reset Scores</button>
        </div>
      </div>
    </main>

    <div class="modal-overlay" id="modal">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button type="button" class="modal-close" onclick="closeModalOnly()" aria-label="Close">✕</button>
        <h2 id="modalTitle">🎉 Winner!</h2>
        <p id="modalMessage">Player X wins!</p>
        <button type="button" class="modal-btn" onclick="closeModal()">Play Again</button>
      </div>
    </div>

    <script>
      // Screen-reader status line. Alternating a trailing no-break space keeps the
      // text genuinely different, so repeats still get announced.
      const srStatus = document.getElementById('srStatus');
      let srFlip = false;
      function announce(message) {
        srFlip = !srFlip;
        srStatus.textContent = srFlip ? message : message + "\u00A0";
      }

      const AudioContext = window.AudioContext || window.webkitAudioContext;
      let audioCtx = null;

      function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
      }

      function playSound(type) {
        // site-wide sound toggle (components.js)
        if (window.pimwMuted) return;
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'place') {
          osc.frequency.setValueAtTime(400, audioCtx.currentTime);
          osc.type = 'sine';
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'win') {
          [523, 659, 784, 1047].forEach((freq, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.12);
            o.type = 'sine';
            g.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.12);
            g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.12 + 0.2);
            o.start(audioCtx.currentTime + i * 0.12);
            o.stop(audioCtx.currentTime + i * 0.12 + 0.2);
          });
        }
      }

      function createConfetti() {
        const colors = ['#ff6b6b', '#4ecdc4', '#ffd700', '#a8e6cf', '#ff9ff3'];
        for (let i = 0; i < 40; i++) {
          const c = document.createElement('div');
          c.className = 'confetti';
          c.style.left = Math.random() * 100 + 'vw';
          c.style.background = colors[Math.floor(Math.random() * colors.length)];
          c.style.animationDelay = Math.random() * 1.5 + 's';
          document.body.appendChild(c);
          setTimeout(() => c.remove(), 4000);
        }
      }

      let board = ['', '', '', '', '', '', '', '', ''];
      let currentPlayer = 'X';
      let gameActive = true;
      let computerTimer = null;   // pending computer move, so it can be cancelled
      let mode = 'friend';
      let scores = { X: 0, O: 0, draws: 0 };

      const winPatterns = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
      ];

      function setMode(m, clickedBtn) {
        mode = m;
        // the button is passed in rather than read off the global event, so
        // keyboard activation (and clicks landing on the emoji) mark the right one
        document.querySelectorAll('.mode-btn').forEach(btn => {
          btn.classList.remove('active');
          btn.setAttribute('aria-pressed', 'false');
        });
        if (clickedBtn) {
          clickedBtn.classList.add('active');
          clickedBtn.setAttribute('aria-pressed', 'true');
        }
        resetGame();
      }

      function cellLabel(index, mark) {
        const row = Math.floor(index / 3) + 1;
        const col = (index % 3) + 1;
        return `Row ${row}, column ${col}, ${mark || 'empty'}`;
      }

      function createBoard() {
        const boardEl = document.getElementById('board');
        boardEl.innerHTML = '';
        for (let i = 0; i < 9; i++) {
          // Stays a <div> so the 3-column grid sizing is untouched; role +
          // tabindex + keydown give it the behaviour of a button.
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.index = i;
          cell.setAttribute('role', 'button');
          cell.setAttribute('tabindex', '0');
          cell.setAttribute('aria-label', cellLabel(i, ''));
          cell.addEventListener('click', () => handleClick(i));
          cell.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
              e.preventDefault(); // Space would otherwise scroll the page
              handleClick(i);
            }
          });
          boardEl.appendChild(cell);
        }
      }

      function handleClick(index) {
        if (!gameActive || board[index] !== '') return;
        // while the computer is "thinking" the board is not yours — without
        // this a second tap places the computer's mark and inverts the turn
        // order for the rest of the game
        if (computerTimer) return;

        makeMove(index, currentPlayer);

        if (gameActive && mode === 'computer' && currentPlayer === 'O') {
          computerTimer = setTimeout(function () {
            computerTimer = null;
            computerMove();
          }, 500);
        }
      }

      function makeMove(index, player) {
        board[index] = player;
        const cell = document.querySelectorAll('.cell')[index];
        cell.textContent = player === 'X' ? '❌' : '⭕';
        cell.classList.add('taken', player.toLowerCase());
        cell.setAttribute('aria-label', cellLabel(index, player));
        cell.setAttribute('aria-disabled', 'true');
        playSound('place');

        const move = cellLabel(index, player);

        if (checkWin(player)) {
          gameActive = false;
          highlightWin();
          scores[player]++;
          updateScores();
          announce(`${move}. Player ${player} wins!`);
          setTimeout(() => showModal('🎉 Winner!', player === 'X' ? '❌ Player X Wins!' : '⭕ Player O Wins!'), 300);
        } else if (board.every(cell => cell !== '')) {
          gameActive = false;
          scores.draws++;
          updateScores();
          announce(`${move}. It's a draw!`);
          setTimeout(() => showModal("🤝 It's a Draw!", 'Good game! Try again?'), 300);
        } else {
          currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
          updateStatus();
          announce(`${move}. Player ${currentPlayer}'s turn.`);
        }
      }

      function computerMove() {
        if (!gameActive) return;
        
        // Try to win
        let move = findBestMove('O');
        // Block player
        if (move === -1) move = findBestMove('X');
        // Take center
        if (move === -1 && board[4] === '') move = 4;
        // Take corner
        if (move === -1) {
          const corners = [0, 2, 6, 8].filter(i => board[i] === '');
          if (corners.length) move = corners[Math.floor(Math.random() * corners.length)];
        }
        // Take any
        if (move === -1) {
          const empty = board.map((c, i) => c === '' ? i : -1).filter(i => i !== -1);
          move = empty[Math.floor(Math.random() * empty.length)];
        }
        
        if (move !== -1) makeMove(move, 'O');
      }

      function findBestMove(player) {
        for (const pattern of winPatterns) {
          const [a, b, c] = pattern;
          const cells = [board[a], board[b], board[c]];
          if (cells.filter(x => x === player).length === 2 && cells.includes('')) {
            return pattern[cells.indexOf('')];
          }
        }
        return -1;
      }

      function checkWin(player) {
        return winPatterns.some(pattern => 
          pattern.every(index => board[index] === player)
        );
      }

      function highlightWin() {
        for (const pattern of winPatterns) {
          if (pattern.every(i => board[i] === board[pattern[0]] && board[i] !== '')) {
            pattern.forEach(i => document.querySelectorAll('.cell')[i].classList.add('winning'));
            break;
          }
        }
      }

      function updateStatus() {
        document.getElementById('status').textContent = 
          currentPlayer === 'X' ? "❌ Player X's turn" : "⭕ Player O's turn";
      }

      function updateScores() {
        document.getElementById('xWins').textContent = scores.X;
        document.getElementById('oWins').textContent = scores.O;
        document.getElementById('draws').textContent = scores.draws;
      }

      function showModal(title, message) {
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalMessage').textContent = message || '';
        const modal = document.getElementById('modal');
        modal.classList.add('show');
        modal.querySelector('.modal-btn').focus();
        if (!title.includes('Draw')) {
          playSound('win');
          createConfetti();
        }
      }

      function closeModalOnly() {
        document.getElementById('modal').classList.remove('show');
      }

      function closeModalOnOverlay(event) {
        if (event.target === event.currentTarget) {
          closeModalOnly();
        }
      }

      function closeModal() {
        closeModalOnly();
        resetGame();
      }

      function resetGame() {
        // a move queued a moment ago would otherwise land on the new board
        clearTimeout(computerTimer);
        computerTimer = null;
        board = ['', '', '', '', '', '', '', '', ''];
        currentPlayer = 'X';
        gameActive = true;
        createBoard();
        updateStatus();
        announce("New game! Player X's turn.");
      }

      function resetScores() {
        scores = { X: 0, O: 0, draws: 0 };
        updateScores();
        announce('Scores reset.');
      }

      // Dismissing by clicking the backdrop is mouse-only, so Escape does the
      // same job for the keyboard.
      document.getElementById('modal').addEventListener('click', closeModalOnOverlay);
      document.addEventListener('keydown', (e) => {
        const modal = document.getElementById('modal');
        if (e.key === 'Escape' && modal.classList.contains('show')) closeModalOnly();
      });

      createBoard();
      updateScores();
    </script>
